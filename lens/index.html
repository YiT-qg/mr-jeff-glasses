<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mr. Jeff Glasses — lens simulator</title>
<style>
  body { background:#111; color:#eee; font-family:system-ui,sans-serif; display:flex;
         flex-direction:column; align-items:center; margin:0; padding:24px; }
  #lens { width:600px; height:600px; background:#000; border:3px solid #444; border-radius:24px;
          display:flex; flex-direction:column; padding:36px; box-sizing:border-box; }
  #step { color:#8ab4ff; font-size:22px; min-height:30px; }
  #title { font-size:40px; font-weight:600; margin:12px 0; }
  .line { font-size:28px; margin:6px 0; color:#ddd; }
  #meta { margin-top:auto; color:#777; font-size:18px; }
  #hint { margin-top:16px; color:#999; font-size:16px; }
  #flash { color:#7dff9b; font-size:20px; min-height:26px; }
  #hist { font-size:20px; color:#bbb; }
</style>
</head>
<body>
<div id="lens">
  <div id="step"></div>
  <div id="title">Waiting for dwell…</div>
  <div id="lines"></div>
  <div id="meta"></div>
</div>
<div id="flash"></div>
<div id="hist"></div>
<div id="hint">Space = pinch / advance &nbsp;·&nbsp; H = history &nbsp;·&nbsp; 600×600 lens simulator</div>
<script>
const step=document.getElementById('step'), title=document.getElementById('title'),
      lines=document.getElementById('lines'), meta=document.getElementById('meta'),
      flash=document.getElementById('flash'), hist=document.getElementById('hist');
let history=[], showingHistory=false, histIdx=0, currentId=null;

function show(card){
  currentId=card.id; showingHistory=false; hist.textContent='';
  step.textContent=card.step||''; title.textContent=card.title;
  lines.innerHTML=''; (card.lines||[]).slice(0,3).forEach(t=>{
    const d=document.createElement('div'); d.className='line'; d.textContent=t; lines.appendChild(d);});
  meta.textContent='card #'+card.id;
}
const ws=new WebSocket('ws://'+location.host+'/ws');
ws.onmessage=e=>{ const m=JSON.parse(e.data);
  if(m.type==='history'){ history=m.cards; if(history.length) show(history[history.length-1]); }
  else if(m.type==='card'){ history.push(m.card); if(!showingHistory) show(m.card); } };
ws.onclose=()=>{ title.textContent='Disconnected — restart run_clip.py'; };

if(new URLSearchParams(location.search).has('bare')){
  document.body.style.padding='0';
  for(const id of ['hint','hist','flash']) document.getElementById(id).style.display='none';
  document.getElementById('lens').style.border='none';
  document.getElementById('lens').style.borderRadius='0';
}
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){ e.preventDefault();
    fetch('/pinch',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({card_id:currentId})});
    if(showingHistory&&history.length){ histIdx=(histIdx+1)%history.length; show(history[histIdx]); }
    else { flash.textContent='Pinched ✓'; setTimeout(()=>flash.textContent='',900); } }
  else if(e.key==='h'||e.key==='H'){ showingHistory=true;
    hist.textContent=history.length? 'History: '+history.map(c=>'#'+c.id+' '+c.title).join('  |  ')
      : 'History: (empty)'; }
});
</script>
</body>
</html>
